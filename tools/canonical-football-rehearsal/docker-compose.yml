services:
  mariadb:
    image: mariadb:10.11.13
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: canonical_football_rehearsal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    tmpfs:
      - /var/lib/mysql:size=1g,mode=0700
      - /tmp:size=128m,mode=1777
    volumes:
      - ./:/rehearsal:ro
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "mariadb-admin", "--protocol=socket", "-uroot", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

networks:
  isolated:
    internal: true
